name: Refresh profile heatmap & GitHub glance

on:
  schedule:
    # Daily at 05:30 UTC
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-heatmap
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Fetch live GitHub contribution calendar & telemetry
      - name: Fetch contributions & glance telemetry
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/fetch-contributions.mjs
          node scripts/fetch-github-glance.mjs

      # Re-render animated contribution heatmap & SVGs
      - name: Render SVGs
        run: |
          node scripts/build-heatmap-svg.mjs
          python scripts/generate_svgs.py

      - name: Commit if changed
        run: |
          git add site/data/ assets/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh daily contribution heatmap & real-time github telemetry"
          git push

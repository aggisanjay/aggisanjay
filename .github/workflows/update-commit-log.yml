name: Update GitHub Contribution Matrix & Profile Assets

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'scripts/**'
      - 'public/**'

permissions:
  contents: write

jobs:
  refresh-contributions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Real GitHub Contributions & Update Assets
        run: |
          python scripts/update_contributions_and_avatar.py

      - name: Commit and Push if Changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/hero.svg assets/contribution-snake.svg
          if git diff --staged --quiet; then
            echo "No contribution changes to commit"
          else
            git commit -m "chore(contributions): sync daily github contribution graph [skip ci]"
            git push
          fi

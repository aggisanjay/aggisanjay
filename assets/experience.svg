<text class="serif" x="54" y="124" font-size="58" font-weight="300" letter-spacing="-1.5" fill="#F8F0F3">ModelSuite <tspan font-style="italic" fill="url(#sheen)">AI</tspan></text>
<text class="sans" x="56" y="166" font-size="18" fill="#B6A3AC">Frontend, backend, auth and AI media-generation workflows.</text>

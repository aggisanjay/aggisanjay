<svg width="1200" height="370" viewBox="0 0 1200 370" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Agentic Support - 03 · AUTONOMOUS AGENT ORCHESTRATION</title>
  <desc>Project showcase card for Agentic Support: Enterprise customer support platform using multi-step graph orchestration and grounded web-search validation.</desc>
  
  <defs>
    
  <style>
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes sheenSweep {
      0% { stop-color: #C77B9B; }
      50% { stop-color: #F8E2EC; }
      100% { stop-color: #C77B9B; }
    }
    @keyframes sheenGradMove {
      0% { x1: 0%; x2: 100%; }
      50% { x1: 50%; x2: 150%; }
      100% { x1: 0%; x2: 100%; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes scanline {
      0% { transform: translateX(-1200px); }
      100% { transform: translateX(1200px); }
    }
    @keyframes orbitDot {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }
    .fade-in { animation: fadeIn 0.8s ease-out forwards; }
    .cursor-blink { animation: blink 1s infinite; }
    .pulse { animation: pulseGlow 3s ease-in-out infinite; }
    .orbit-spin { transform-origin: 935px 245px; animation: orbitDot 24s linear infinite; }
    
    @media (prefers-reduced-motion: reduce) {
      *, .fade-in, .cursor-blink, .pulse, .orbit-spin {
        animation: none !important;
        transform: none !important;
      }
    }
  </style>

    <!-- Background linear gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>

    <!-- Radial wine glow top-right -->
    <radialGradient id="radialGlow" cx="88%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#451126" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#190B12" stop-opacity="0" />
    </radialGradient>

    <!-- Sheen gradient for italic words -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5B5C7" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C77B9B" />
      <animate attributeName="x1" values="0%;60%;0%" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;160%;100%" dur="6s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Pill / Chip Gradient -->
    <linearGradient id="chipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#260F1E" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#160811" stop-opacity="0.9" />
    </linearGradient>

    <!-- Divider Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity="0.02" />
      <stop offset="25%" stop-color="#C77B9B" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#E5B5C7" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#C77B9B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#C77B9B" stop-opacity="0.02" />
    </linearGradient>

    <!-- Faint 40px grid pattern -->
    <pattern id="grid40" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#C77B9B" stroke-opacity="0.045" stroke-width="1" />
    </pattern>

    <!-- Subtle Drop Shadow -->
    <filter id="glowDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>


  <!-- Card Frame -->
  <rect width="1200" height="370" rx="20" fill="url(#cardBg)" stroke="#C77B9B" stroke-opacity="0.16" stroke-width="1" />
  <rect width="1200" height="370" rx="20" fill="url(#grid40)" />
  <rect width="1200" height="370" rx="20" fill="url(#radialGlow)" />

  <!-- Left Content Column -->
  <g class="fade-in">
    <!-- Index · Category label -->
    <text x="55" y="55" font-family="'SF Mono', ui-monospace, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="2.8" fill="#C77B9B" font-weight="600">03 · AUTONOMOUS AGENT ORCHESTRATION</text>

    <!-- 52px Serif Project Name -->
    <text x="55" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="300" fill="#F8F0F3" letter-spacing="-0.5">
      Agentic Support<tspan font-style="italic" fill="url(#sheen)">.</tspan>
    </text>

    <!-- One-line Description -->
    <text x="55" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#F8F0F3" font-weight="400">
      Enterprise customer support platform using multi-step graph orchestration and grounded web-search validation.
    </text>

    <!-- BUILT > Mono Line -->
    <text x="55" y="180" font-family="'SF Mono', ui-monospace, Menlo, Monaco, Consolas, monospace" font-size="11.5" letter-spacing="1.8" fill="#B6A3AC">
      <tspan fill="#C77B9B" font-weight="600">BUILT ›</tspan> LANGGRAPH MULTI-STEP REASONING · DYNAMIC TOOL CALLING · MULTI-PROVIDER ROUTING
    </text>

    <!-- 3 Big Stats Row -->
    <g transform="translate(55, 205)">
      <!-- Stat 1 -->
      <g>
        <text x="0" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="300" fill="#F8F0F3">LangGraph</text>
        <text x="0" y="52" font-family="'SF Mono', ui-monospace, monospace" font-size="10.5" letter-spacing="1.2" fill="#B6A3AC">Stateful Multi-Step Graph</text>
      </g>
      <!-- Stat 2 -->
      <g transform="translate(225, 0)">
        <text x="0" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="300" fill="#F8F0F3">Multi-LLM</text>
        <text x="0" y="52" font-family="'SF Mono', ui-monospace, monospace" font-size="10.5" letter-spacing="1.2" fill="#B6A3AC">OpenAI &amp; Gemini Dynamic Router</text>
      </g>
      <!-- Stat 3 -->
      <g transform="translate(450, 0)">
        <text x="0" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="300" fill="#F8F0F3">Zero-Shot</text>
        <text x="0" y="52" font-family="'SF Mono', ui-monospace, monospace" font-size="10.5" letter-spacing="1.2" fill="#B6A3AC">Tool-Calling Support Desk</text>
      </g>
    </g>

    <!-- Tech Chips Row -->
    <g>
      
        <rect x="55" y="312" width="64" height="26" rx="13" fill="url(#chipBg)" stroke="#C77B9B" stroke-opacity="0.22" stroke-width="1" />
        <text x="87.0" y="329" text-anchor="middle" font-family="'SF Mono', ui-monospace, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#E5B5C7">React</text>
        
        <rect x="129" y="312" width="104" height="26" rx="13" fill="url(#chipBg)" stroke="#C77B9B" stroke-opacity="0.22" stroke-width="1" />
        <text x="181.0" y="329" text-anchor="middle" font-family="'SF Mono', ui-monospace, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#E5B5C7">TypeScript</text>
        
        <rect x="243" y="312" width="80" height="26" rx="13" fill="url(#chipBg)" stroke="#C77B9B" stroke-opacity="0.22" stroke-width="1" />
        <text x="283.0" y="329" text-anchor="middle" font-family="'SF Mono', ui-monospace, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#E5B5C7">Node.js</text>
        
        <rect x="333" y="312" width="96" height="26" rx="13" fill="url(#chipBg)" stroke="#C77B9B" stroke-opacity="0.22" stroke-width="1" />
        <text x="381.0" y="329" text-anchor="middle" font-family="'SF Mono', ui-monospace, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#E5B5C7">LangChain</text>
        
        <rect x="439" y="312" width="96" height="26" rx="13" fill="url(#chipBg)" stroke="#C77B9B" stroke-opacity="0.22" stroke-width="1" />
        <text x="487.0" y="329" text-anchor="middle" font-family="'SF Mono', ui-monospace, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#E5B5C7">LangGraph</text>
        
        <rect x="545" y="312" width="72" height="26" rx="13" fill="url(#chipBg)" stroke="#C77B9B" stroke-opacity="0.22" stroke-width="1" />
        <text x="581.0" y="329" text-anchor="middle" font-family="'SF Mono', ui-monospace, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#E5B5C7">OpenAI</text>
        
        <rect x="627" y="312" width="72" height="26" rx="13" fill="url(#chipBg)" stroke="#C77B9B" stroke-opacity="0.22" stroke-width="1" />
        <text x="663.0" y="329" text-anchor="middle" font-family="'SF Mono', ui-monospace, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#E5B5C7">Gemini</text>
        
        <rect x="709" y="312" width="72" height="26" rx="13" fill="url(#chipBg)" stroke="#C77B9B" stroke-opacity="0.22" stroke-width="1" />
        <text x="745.0" y="329" text-anchor="middle" font-family="'SF Mono', ui-monospace, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#E5B5C7">Tavily</text>
        
    </g>
  </g>

  <!-- Right Side Node-Flow Diagram -->
  
        <!-- Node-flow diagram for LangGraph Multi-Step Agent -->
        <g transform="translate(730, 45)">
          <rect width="415" height="280" rx="14" fill="#13050D" stroke="#C77B9B" stroke-opacity="0.16" stroke-width="1" />
          <text x="25" y="30" font-family="'SF Mono', ui-monospace, monospace" font-size="10" letter-spacing="2" fill="#C77B9B">LANGGRAPH STATEFUL REASONING</text>

          <!-- Curved Loops -->
          <path d="M 65 95 L 135 95" stroke="#701A3D" stroke-width="2" fill="none" />
          <path d="M 215 80 C 255 50, 305 50, 320 80" stroke="#E5B5C7" stroke-width="2" fill="none" />
          <path d="M 320 110 C 305 140, 255 140, 215 110" stroke="#701A3D" stroke-width="2" fill="none" />
          <path d="M 335 125 C 335 180, 270 205, 205 205 L 85 205" stroke="#C77B9B" stroke-opacity="0.6" stroke-width="2" fill="none" />

          <!-- Nodes -->
          <rect x="15" y="78" width="60" height="34" rx="8" fill="#200D18" stroke="#C77B9B" stroke-opacity="0.3" />
          <text x="45" y="99" text-anchor="middle" font-family="'SF Mono', monospace" font-size="10" fill="#F8F0F3">Ticket</text>

          <rect x="135" y="72" width="85" height="46" rx="8" fill="#451126" stroke="#C77B9B" stroke-opacity="0.6" />
          <text x="177" y="93" text-anchor="middle" font-family="'SF Mono', monospace" font-size="10.5" fill="#FFFFFF" font-weight="600">Supervisor</text>
          <text x="177" y="106" text-anchor="middle" font-family="'SF Mono', monospace" font-size="8.5" fill="#E5B5C7">Decision Node</text>

          <rect x="290" y="72" width="105" height="46" rx="8" fill="#380E23" stroke="#E5B5C7" stroke-opacity="0.5" />
          <text x="342" y="93" text-anchor="middle" font-family="'SF Mono', monospace" font-size="10" fill="#FFFFFF" font-weight="600">Tool Caller</text>
          <text x="342" y="106" text-anchor="middle" font-family="'SF Mono', monospace" font-size="8.5" fill="#E5B5C7">Web + Internal KB</text>

          <rect x="25" y="188" width="85" height="34" rx="8" fill="#200D18" stroke="#E5B5C7" stroke-opacity="0.5" />
          <text x="67" y="209" text-anchor="middle" font-family="'SF Mono', monospace" font-size="10" fill="#E5B5C7">Resolved SSE</text>

          <!-- Animated Moving Dot in the Agent Loop -->
          <circle r="4" fill="#E5B5C7">
            <animateMotion path="M 65 95 L 135 95 L 215 80 C 255 50, 305 50, 320 80 L 320 110 C 305 140, 255 140, 215 110 L 335 125 C 335 180, 270 205, 205 205 L 85 205" 
                           dur="5s" repeatCount="indefinite" />
          </circle>
        </g>
        
</svg>